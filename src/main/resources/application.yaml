spring:
  application:
    name: auditlog-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  jpa:
    # schema.sql owns the schema, including the constraints and the genesis chain-state row.
    # Hibernate must not touch it: for an embedded datasource it would otherwise default to
    # create-drop and recreate the tables after schema.sql ran, discarding the genesis row.
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    # Serve the contract-first spec (src/main/resources/static/openapi.yml) instead of
    # the runtime-generated one, so the UI matches the code-generated API.
    url: /openapi.yml

audit:
  events:
    # Records whose created_at is older than this are archived by the scheduler.
    retention-days: 30
    # Fixed delay between archive runs, in milliseconds (default: 24h).
    archive-interval-ms: 86400000
    # Delay before the first archive run after startup, in milliseconds.
    archive-initial-delay-ms: 60000
