spring:
  application:
    name: auditlog-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql
  jpa:
    # schema.sql owns the schema, including the constraints and the genesis chain-state row.
    # Hibernate must not touch it: for an embedded datasource it would otherwise default to
    # create-drop and recreate the tables after schema.sql ran, discarding the genesis row.
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
